server {
    listen 80;
    server_name localhost;

    # Laravel は public/ をドキュメントルートにする（.env 等を外部に晒さないため）
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    location / {
        # 実ファイルが無いリクエストはすべて index.php（Laravel のルーター）へ
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # app コンテナの PHP-FPM（9000番）へ転送
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
